spring.application.name=course-manager
spring.datasource.url=${COURSE_DB_URL:jdbc:h2:file:./data/coursemanager}
spring.datasource.username=${COURSE_DB_USER:sa}
spring.datasource.password=${COURSE_DB_PASSWORD:}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
server.address=${SERVER_ADDRESS:127.0.0.1}
server.port=${PORT:8080}
app.time-zone=${APP_TIME_ZONE:America/Vancouver}
